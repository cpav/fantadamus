[project]
name = "fantadamus"
version = "0.0.0"
description = "A Fantacalcio advisor: data products, a decision engine and MCP tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0,<3",
    "mcp>=2.3,<3",
    "pydantic>=2.14,<3",
]

[project.scripts]
fantadamus = "fantadamus.cli.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "conventional-pre-commit>=4.4,<5",
    "hypothesis>=6.170,<7",
    "mutmut>=3.7,<3.8",  # 3.8 needs libcst>=1.9, which has no Intel-Mac wheel for 3.12 (ADR-0001 amendment)
    "mypy>=2.4,<3",
    "pip-audit>=2.10,<3",
    "pre-commit>=4.7,<5",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-socket>=0.8,<1",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.17,<0.18",
    "sqlfluff>=4.4,<5",
    "types-pyyaml>=6",
    "yamllint>=1.38,<2",
]

[tool.uv]
# libcst 1.9 ships no macOS x86_64 wheel for Python 3.12; building it needs Rust. Lift with ADR-0001's amendment.
# cryptography 49+ likewise ships no macOS x86_64 wheel (pulled in by mcp); risk accepted, ADR-0001.
constraint-dependencies = [
    "libcst>=1.8.5,<1.9",
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Everywhere else (CI, Linux servers), take the patched releases (PYSEC-2026-3552 to 3554).
    "cryptography>=50; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Unix sockets stay allowed: asyncio's event loop uses a socketpair even without network access.
addopts = "-q --strict-markers --allow-unix-socket"
# Any single test over two minutes fails with a traceback, so a hang names itself instead of stalling the run.
timeout = 120
markers = [
    "unit: pure functions, no I/O; network blocked",
    "property: Hypothesis property-based tests; network blocked",
    "contract: parsers and schemas against recorded or synthetic payloads",
    "integration: several components together, on DuckDB and moto; no network",
    "acceptance: the spec's acceptance tests",
    "infra: infrastructure tests (Terraform, IAM policy evaluator)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# E/W/F pycodestyle and pyflakes, I isort, N naming, UP pyupgrade, B bugbear, S bandit, C4 comprehensions,
# SIM simplifications, PT pytest style, PGH blanket noqa/type-ignore (R6.1), RUF incl. RUF100 unused noqa (R6.4).
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "PT", "PGH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Registered as S-005 in docs/quality/suppressions.md: plain assert is how pytest tests assert.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
# Line and branch coverage of the product code and the checks (R8.1). The gate self-tests drive git and
# GitHub, so they are tested by running them, not by coverage.
branch = true
source = ["src", "scripts"]
omit = ["scripts/selftest/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.json]
output = "coverage.json"

[tool.mutmut]
# The core modules for mutation testing at phase gates (R1.7).
paths_to_mutate = ["scripts/checks/", "src/fantadamus/core/"]
tests_dir = ["tests/unit/", "tests/property/"]
