# What compare_players asks Claude to read for each fact (design C11), from docs/source-registry.md, "What we
# read for each need". For each fact: the submit tool that takes it, then fixed `pages` and `search` hints, best
# first. Claude works down them until one opens, so no fact rests on a single page, and Wikipedia is never
# first: Claude's reader may only see a stale cache of it (R11.4; tests/unit/test_sources_config.py).
# Every page, and every `site:` in a search, must be on the allowlist in config/sources.toml.
# Placeholders, filled by compare_players: {home} and {away} (the match's clubs), {club} (a club key from
# config/clubs.toml) and {player} (his name). The season pages change each summer, with config/clubs.toml.
# `patterns` are addresses read_page also accepts, reached only through a link on a listed page or a search,
# never shown in a refresh plan; each {placeholder} in them matches one path segment (mvp-collect C3.2).

# The page Fantadamus reads itself (mvp-collect C6): Fantacalcio-Online's round page, which carries the
# fixtures, four outlets' lineups, the official lineups and the odds. `current_round` serves the next round
# whose deadline hasn't passed and names it in its title; `round` is round n's page. Set `enabled = false`
# to switch it off (R2.5): Claude then reads those facts through read_page, from the pages below.
[collector]
enabled = true
current_round = "https://www.fantacalcio-online.com/it/serie-a/2026-2027/probabili-formazioni/ultima-giornata"
round = "https://www.fantacalcio-online.com/it/serie-a/2026-2027/probabili-formazioni/{round}-giornata"

[facts.fixtures]
need = "N2"
submit_tool = "submit_fixtures"
pages = [
    "https://www.fantacalcio.it/serie-a/calendario",
    "https://it.wikipedia.org/wiki/Serie_A_2026-2027",
]
search = ["calendario Serie A giornata site:fantacalcio.it"]

[facts.probable_lineups]
need = "N3"
submit_tool = "submit_probable_lineups"
pages = [
    "https://www.fantacalcio.it/probabili-formazioni-serie-a",
    "https://www.fantacalcio-online.com/it/serie-a/2026-2027/probabili-formazioni/ultima-giornata",
    "https://www.sosfanta.com/lista-formazioni/probabili-formazioni-serie-a/",
]
search = ["{home} {away} probabili formazioni site:fantacalcio.it"]

[facts.official_lineups]
need = "N4"
submit_tool = "submit_official_lineup"
search = [
    "{home} {away} formazioni ufficiali site:fantacalcio.it",
    "{home} {away} formazioni ufficiali site:sosfanta.com",
]

[facts.match_odds]
need = "N14"
submit_tool = "submit_match_odds"
search = [
    "{home} {away} quote over under goal no goal site:livetipsportal.com",
    "{home} {away} quote site:jamma.tv",
    "{home} {away} quote pronostico site:jamma.it",
]

[facts.player_season]
need = "N5"
submit_tool = "submit_player_season"
search = [
    "{player} {club} site:fantacalcio.it/serie-a/squadre",
    "{player} statistiche fantacalcio site:fantacalcio.it",
]
patterns = [
    "https://www.fantacalcio.it/serie-a/squadre/{club}",
    "https://www.fantacalcio.it/serie-a/squadre/{club}/{player}/{id}",
]

[facts.team_season]
need = "N5"
submit_tool = "submit_team_season"
pages = [
    "https://www.fantacalcio.it/serie-a/classifica",
    "https://it.wikipedia.org/wiki/Serie_A_2026-2027",
]
search = ["classifica Serie A site:fantacalcio.it"]

[facts.penalty_takers]
need = "N9"
submit_tool = "submit_penalty_takers"
pages = ["https://www.fantacalcio.it/rigoristi-serie-a"]
search = ["rigoristi Serie A site:fantacalcio.it"]
