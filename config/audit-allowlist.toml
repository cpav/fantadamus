# Dependency-audit exceptions (R11.2, R11.3). Each entry needs the vulnerability id, a reason and an
# expiry date; an expired entry fails the audit. Each also needs a row in docs/quality/suppressions.md.
#
# [[ignore]]
# id = "PYSEC-YYYY-NN"
# reason = "why it cannot be fixed yet"
# expires = YYYY-MM-DD

# The three below affect cryptography 48.0.1, which only the owner's Intel Mac installs (no macOS x86_64
# wheel for 49+; ADR-0001 amendment). CI and Linux servers install 50.0.2, which fixes them.
[[ignore]]
id = "PYSEC-2026-3552"
reason = "Intel-Mac dev environment only; PKCS#7 EnvelopedData decryption, which Fantadamus never calls"
expires = 2026-11-30

[[ignore]]
id = "PYSEC-2026-3553"
reason = "Intel-Mac dev environment only; X.509 path building, which Fantadamus never calls"
expires = 2026-11-30

[[ignore]]
id = "PYSEC-2026-3554"
reason = "Intel-Mac dev environment only; X.509 name-constraint verification, which Fantadamus never calls"
expires = 2026-11-30
